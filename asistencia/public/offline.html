<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sin conexión</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0d12;color:#e8ebf1;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
.c{max-width:360px}h1{font-size:20px}p{color:#98a1b3;line-height:1.5}button{margin-top:16px;padding:12px 20px;border-radius:12px;border:0;background:#2453e0;color:#fff;font-size:16px}</style></head>
<body><div class="c"><h1>No hay conexión a Internet</h1>
<p>Para registrar tu asistencia necesitás conexión: la fichada se valida en el servidor en el momento. No se guardan fichadas para enviar después.</p>
<p>Si el problema continúa, usá la terminal del local o avisá a tu encargado.</p>
<button onclick="location.reload()">Reintentar</button></div></body></html>
