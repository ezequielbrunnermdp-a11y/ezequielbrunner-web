# Netlify · ezequielbrunner.com
#
# Pulso Informativo guarda en este repositorio sus noticias, sus placas para Instagram y su
# automatización. Esos cambios no modifican la web, así que no disparan una publicación del sitio:
# cada publicación consume créditos de Netlify.
#
# Se publica cuando cambia algo fuera de pulso-news/, public/pulso-informativo/ y .github/.
# Una publicación pedida a mano (sin cambios nuevos) o sin historial previo siempre se hace.
# El comando devuelve 0 para omitir la publicación y otro valor para hacerla.
[build]
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)pulso-news' ':(exclude)public/pulso-informativo' ':(exclude).github'"
